<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>HommieGo - Connecting You to Trusted Services, Instantly</title>

  <!-- SEO & PWA Meta Tags -->
  <meta name="description"
    content="Find verified service providers near you in Kenya. Car hire, photographers, tutors, beauticians, and more. Chat instantly, book easily, pay securely with M-Pesa." />
  <meta name="author" content="HommieGo" />
  <meta name="theme-color" content="#0F172A" />

  <!-- Manifest & Mobile App Tags -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HommieGo" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph -->
  <meta property="og:title" content="HommieGo - Connecting You to Trusted Services, Instantly" />
  <meta property="og:description"
    content="Find verified service providers near you in Kenya. Book services instantly with secure M-Pesa payments." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hommiego.co.ke" />
  <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@HommieGo_ke" />
  <meta name="twitter:title" content="HommieGo - Connecting You to Trusted Services, Instantly" />
  <meta name="twitter:description"
    content="Find verified service providers near you in Kenya. Book services instantly with secure M-Pesa payments." />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Theme Initialization -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('theme');
        const root = document.documentElement;
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        root.classList.remove('dark', 'light');

        if (savedTheme === 'dark') {
          root.classList.add('dark');
          themeMeta?.setAttribute('content', '#0F172A');
        } else if (savedTheme === 'light') {
          root.classList.add('light');
          themeMeta?.setAttribute('content', '#F8FAFC');
        } else {
          const prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (prefersDark) {
            root.classList.add('dark');
            themeMeta?.setAttribute('content', '#0F172A');
          } else {
            root.classList.add('light');
            themeMeta?.setAttribute('content', '#F8FAFC');
          }
        }
      } catch (e) {
        // Do nothing. Let the app determine the theme normally.
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
